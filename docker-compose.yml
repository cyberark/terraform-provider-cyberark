services:
  goreleaser:
    build:
      context: .
      dockerfile: Dockerfile.goreleaser
    environment:
      SECRETSHUB_VERSION:
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      NETRC: /run/secrets/gonetrc
    volumes:
      - .:/terraform-provider-cyberark
    working_dir: /terraform-provider-cyberark
    secrets:
      - gonetrc
  unit_tests:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      secrets:
        - gonetrc
    environment:
      SECRETSHUB_VERSION:
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      NETRC: /run/secrets/gonetrc
      TF_TENANT_NAME:
      TF_DOMAIN_NAME:
      TF_CLIENT_ID:
      TF_CLIENT_SECRET:
      TF_AWS_ALIAS:
      TF_AWS_ACCOUNT_REGION:
      TF_AWS_ACCOUNT_ID:
      TF_AWS_IAM_ROLE:
      TF_SOURCE_ID:
    volumes:
      - .:/terraform-provider-cyberark
    secrets:
      - gonetrc

secrets:
  gonetrc:
    file: ${GO_NETRC_FILE:-/dev/null}
